<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Innovizer Pilot v0.1</title><style>
:root{--bg:#f6f3ec;--card:#fff;--text:#1e1d1a;--muted:#6d675d;--line:#ded8cc;--accent:#e76f3c;--ok:#2d7d5d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}header{padding:24px 30px;border-bottom:1px solid var(--line);background:#fbfaf6;display:flex;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:26px}.tag{font-size:12px;background:#efe9dc;padding:7px 10px;border-radius:99px}.wrap{max-width:1180px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:390px 1fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.card h2{margin:0 0 14px;font-size:17px}.muted{color:var(--muted);font-size:13px}.projects{max-height:620px;overflow:auto}.project{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}.project:hover,.project.sel{border-color:var(--accent);background:#fff9f4}.name{font-weight:650;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.btn{border:0;background:var(--accent);color:white;font-weight:650;border-radius:10px;padding:11px 14px;cursor:pointer}.btn:disabled{opacity:.45}.chat{height:475px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fdfcf9}.msg{max-width:82%;padding:10px 12px;border-radius:12px;margin:9px 0;font-size:14px;line-height:1.45}.eva{background:#f2ece2}.you{background:#fff1e8;margin-left:auto}.compose{display:flex;gap:9px;margin-top:10px}.compose textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:64px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{font-size:11px;padding:5px 7px;border-radius:99px;background:#eee9df}.chip.ok{background:#e7f4ed;color:var(--ok)}pre{white-space:pre-wrap;font-size:11px;background:#f7f4ee;border-radius:10px;padding:10px;max-height:240px;overflow:auto}@media(max-width:850px){.wrap{grid-template-columns:1fr}.projects{max-height:280px}}
</style></head><body><header><div><div class="brand">Innovizer</div><div class="muted">Pilot v0.1 · Dunasys 2025</div></div><div class="tag">Brick 01 → Project screening → Eva</div></header><div class="wrap"><section class="card"><h2>1. Projets candidats</h2><div class="muted">Snapshot réel de la Brique 01. Choisis un projet puis lance Eva.</div><input id="search" placeholder="Rechercher un projet…" style="width:100%;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:10px"><div id="projects" class="projects"></div></section><section class="card"><h2>2. Audit Eva</h2><div id="selected" class="muted">Aucun projet sélectionné.</div><div style="margin:12px 0"><button class="btn" id="start" disabled>Démarrer l'entretien</button> <button class="btn" id="finalize" disabled style="background:#333">Finaliser</button></div><div id="coverage" class="chips"></div><div id="chat" class="chat"></div><div class="compose"><textarea id="reply" placeholder="Réponse du CTO…"></textarea><button class="btn" id="send" disabled>Envoyer</button></div><div id="result"></div></section></div><script>
let projects=[], selected=null, session=null, pending=null; const $=id=>document.getElementById(id);
function esc(s){return (s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderProjects(){let q=$('search').value.toLowerCase(); $('projects').innerHTML=projects.filter(p=>p.code_projet.toLowerCase().includes(q)).map(p=>`<div class="project ${selected===p.code_projet?'sel':''}" data-code="${esc(p.code_projet)}"><div class="name">${esc(p.code_projet)}</div><div class="meta">${Math.round(p.heures||0).toLocaleString('fr-FR')} h · ${p.collaborateurs||0} collaborateurs · ${esc(p.thematique_chapeau||'sans thématique')}</div></div>`).join(''); document.querySelectorAll('.project').forEach(x=>x.onclick=()=>select(x.dataset.code));}
function select(code){selected=code; session=null; pending=null; $('selected').textContent=code; $('start').disabled=false; $('send').disabled=true; $('finalize').disabled=true; $('chat').innerHTML=''; $('result').innerHTML=''; $('coverage').innerHTML=''; renderProjects()}
function add(who,text){$('chat').innerHTML+=`<div class="msg ${who}">${esc(text)}</div>`; $('chat').scrollTop=$('chat').scrollHeight}
function cov(c){$('coverage').innerHTML=Object.entries(c||{}).map(([k,v])=>`<span class="chip ${v==='COMPLET'?'ok':''}">${k}: ${v}</span>`).join('')}
async function load(){let r=await fetch('/api/projects'); projects=(await r.json()).projects; renderProjects()}
$('search').oninput=renderProjects;
$('start').onclick=async()=>{let r=await fetch('/api/interviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code_projet:selected,interlocuteur:'CTO',regime:'CIR'})}); let d=await r.json(); session=d.id; add('eva',d.ouverture); if(d.question){pending=d.question;add('eva',d.question.question)} $('send').disabled=false;$('finalize').disabled=false};
$('send').onclick=async()=>{let text=$('reply').value.trim(); if(!text||!session)return;add('you',text);$('reply').value='';let r=await fetch(`/api/interviews/${session}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reponse:text})});let d=await r.json();cov(d.couverture);if(d.question){pending=d.question;add('eva',d.question.question)}else{$('send').disabled=true}};
$('finalize').onclick=async()=>{if(!session)return;let r=await fetch(`/api/interviews/${session}/finalize`,{method:'POST'});let d=await r.json();let s=d.fiche.synthese;$('result').innerHTML=`<h3>Pré-audit</h3><div class="chips"><span class="chip">Couverture ${s.couverture_pct}%</span><span class="chip">Défendabilité ${s.defendabilite}</span><span class="chip">${s.red_flags.length} red flags</span></div><pre>${esc(JSON.stringify(s,null,2))}</pre>`};
load();
</script></body></html>
